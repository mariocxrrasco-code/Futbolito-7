databases:
  - name: futbolito7-db
    plan: free
    databaseName: futbolito7_db
    user: futbolito_user

services:
  - type: web
    name: futbolito-7
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: python manage.py migrate && python manage.py seed_data && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: futbolito7-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: "2525"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        value: c15163001@smtp-brevo.com
      - key: DEFAULT_FROM_EMAIL
        value: Futbolito 7 Club Deportivo <futbolito761@gmail.com>
